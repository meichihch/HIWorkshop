<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幸福力互動牆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100dvh; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .wrap { max-width: 560px; margin: 0 auto; padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
  header { display: flex; align-items: center; gap: 10px; }
  header .who { margin-left: auto; font-size: .85rem; color: var(--muted); text-align: right; }
  header .who button { border: 0; background: none; color: var(--accent); text-decoration: underline; padding: 0; font-size: .85rem; }
  .brand { font-family: var(--display); font-size: 1.15rem; font-weight: 700; line-height: 1.2; }
  .card { background: var(--surface); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); border-radius: 22px; padding: 22px 20px; display: grid; gap: 16px; box-shadow: 0 18px 40px -28px rgba(40,40,90,.35); }
  .eyebrow { font-size: .78rem; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .prompt { font-family: var(--display); font-weight: 700; font-size: 1.55rem; line-height: 1.35; margin: 0; white-space: pre-line; text-wrap: balance; }
  .hint { color: var(--muted); margin: -6px 0 0; font-size: .92rem; }
  .row { display: flex; gap: 10px; }
  .row .input { flex: 1; min-width: 0; }
  .options { display: grid; gap: 10px; }
  .option { text-align: left; border: 1.5px solid var(--glass-line); background: rgba(255,255,255,.7); border-radius: 14px; padding: 14px 16px; font-weight: 600; font-size: 1.02rem; display: flex; align-items: center; gap: 12px; }
  .option .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; }
  .option[aria-pressed="true"] { border-color: var(--forest); background: color-mix(in srgb, var(--c, var(--accent)) 14%, #fff); }
  .mine { display: flex; flex-wrap: wrap; gap: 6px; }
  .mine span { background: rgba(255,255,255,.75); border-radius: 999px; padding: 2px 10px; font-size: .88rem; }
  .wall { display: grid; gap: 12px; }
  .wall-head { display: flex; justify-content: space-between; align-items: baseline; }
  .wall-head h2 { font-size: 1rem; margin: 0; }
  .photo-pick { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .photo-pick img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
  .waiting { text-align: center; padding: 36px 20px; }
  .waiting .big { font-weight: 700; font-size: 1.4rem; margin: 12px 0 4px; }
  .pulse { width: 74px; height: 74px; margin: 0 auto; border-radius: 50%; background: rgba(255,255,255,.6); display: grid; place-items: center; animation: breathe 3s ease-in-out infinite; }
  .pulse::before { content: ""; width: 48px; height: 48px; border-radius: 50%; background: var(--lime); grid-area: 1/1; }
  .pulse::after { content: ""; width: 22px; height: 22px; border-radius: 50%; background: var(--forest); grid-area: 1/1; }
  @keyframes breathe { 50% { transform: scale(1.08); } }
  .reply-box { display: flex; gap: 8px; margin-top: 8px; }
  .reply-box .input { padding: .5em .7em; font-size: .92rem; }
  .note .act { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: .8rem; padding: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="who" id="who"></div>
  </header>
  <main id="app"></main>
</div>

<script src="lib/supabase.js"></script>
<script src="config.js"></script>
<script src="survey.js"></script>
<script src="questions.js"></script>
<script src="backend.js"></script>
<script src="student.js"></script>
</body>
</html>
